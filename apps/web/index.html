<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="application-name" content="Kabtn Bot" />
    <meta name="author" content="Kabtn Bot" />
    <link rel="canonical" href="https://kabtnbot.com/" />

    <link rel="apple-touch-icon" href="/og-image.png" />

    <meta property="og:site_name" content="كابتن بوت" />
    <meta property="og:title" content="كابتن بوت — بوت ديسكورد عربي بمساعد صوتي ذكي" />

    <meta property="og:image" content="https://kabtnbot.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Kabtn Bot — AI voice assistant, moderation, anti-spam, welcome, automations & AI channel organizer for Discord" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta property="og:locale:alternate" content="tr_TR" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="كابتن بوت — بوت ديسكورد عربي بمساعد صوتي ذكي" />
    <meta
      name="twitter:description"
      content="مساعد صوتي بالذكاء الاصطناعي، حماية ومكافحة سبام، ترحيب، أتمتة الأوامر، وترتيب القنوات تلقائياً."
    />
    <meta name="twitter:image" content="https://kabtnbot.com/og-image.png" />

    <!-- Structured data: the bot as a software application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Kabtn Bot",
        "alternateName": "كابتن بوت",
        "applicationCategory": "CommunicationApplication",
        "applicationSubCategory": "Discord Bot",
        "operatingSystem": "Discord",
        "url": "https://kabtnbot.com/",
        "image": "https://kabtnbot.com/og-image.png",
        "screenshot": "https://kabtnbot.com/og-image.png",
        "inLanguage": ["ar", "en", "de", "fr", "ru", "tr"],
        "description": "بوت ديسكورد عربي بمساعد صوتي بالذكاء الاصطناعي، حماية ومكافحة سبام، رسائل ترحيب، أتمتة الأوامر، وترتيب القنوات تلقائياً.",

          "AI voice assistant",
          "Moderation",
          "Anti-spam",
          "Welcome messages & auto roles",
          "Command automations",
          "AI channel organizer",
          "Server stats"
        ],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css?family=Cairo:400,700,900&display=swap&subset=arabic,latin"
      rel="stylesheet"
    />
    <script>
      // Apply the stored theme BEFORE first paint — a dark flash on a light
      // theme (or vice versa) reads as a broken page.
      try {
        if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light');
      } catch (e) { /* storage blocked — dark default */ }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
