name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Dummy values: the config modules validate env at import time; tests
      # themselves use mongodb-memory-server and never call external APIs.
      DISCORD_TOKEN: ci-dummy-token
      DISCORD_CLIENT_ID: '000000000000000000'
      DISCORD_CLIENT_SECRET: ci-dummy-secret
      MONGODB_URI: mongodb://127.0.0.1:27017/ci
      SESSION_SECRET: ci-dummy-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: pnpm

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test
